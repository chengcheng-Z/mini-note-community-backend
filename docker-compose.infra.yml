name: xiaohashu

networks:
  xiaohashu:
    name: xiaohashu

volumes:
  mysql-data:
  redis-data:
  cassandra-data:
  rocketmq-namesrv-logs:
  rocketmq-broker-logs:
  rocketmq-broker-store:
  nacos-data:
  minio-data:

services:
  mysql:
    image: mysql:8.0.39
    restart: unless-stopped
    mem_limit: 384m
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xiaohashu}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=96M
      - --performance-schema=OFF
      - --max-connections=100
    ports:
      - "${INFRA_BIND_IP:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/init/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - xiaohashu

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    mem_limit: 96m
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "${INFRA_BIND_IP:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - xiaohashu

  cassandra:
    image: cassandra:4.1
    restart: unless-stopped
    mem_limit: 640m
    environment:
      TZ: Asia/Shanghai
      CASSANDRA_CLUSTER_NAME: xiaohashu
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_BROADCAST_ADDRESS: ${CASSANDRA_BROADCAST_ADDRESS:-}
      CASSANDRA_BROADCAST_RPC_ADDRESS: ${CASSANDRA_BROADCAST_RPC_ADDRESS:-}
      HEAP_NEWSIZE: 64M
      MAX_HEAP_SIZE: 256M
    ports:
      - "${INFRA_BIND_IP:-127.0.0.1}:${CASSANDRA_PORT:-9042}:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - xiaohashu

  cassandra-init:
    image: cassandra:4.1
    restart: "no"
    mem_limit: 96m
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./deploy/init/cassandra:/init:ro
    entrypoint: ["/bin/sh", "-c", "cqlsh cassandra 9042 -f /init/01-schema.cql"]
    networks:
      - xiaohashu

  rocketmq-namesrv:
    image: apache/rocketmq:4.9.4
    restart: unless-stopped
    mem_limit: 192m
    command: sh mqnamesrv
    environment:
      TZ: Asia/Shanghai
      JAVA_OPT_EXT: "-Xms96m -Xmx96m -Xmn48m"
    ports:
      - "${INFRA_BIND_IP:-127.0.0.1}:9876:9876"
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs
    networks:
      - xiaohashu

  rocketmq-broker:
    image: apache/rocketmq:4.9.4
    restart: unless-stopped
    mem_limit: 320m
    depends_on:
      - rocketmq-namesrv
    command:
      - sh
      - -c
      - |
        if [ -n "$$BROKER_IP" ]; then
          sed -i "s/^brokerIP1=.*/brokerIP1=$$BROKER_IP/" /home/rocketmq/conf/broker.conf
        fi
        sh mqbroker -c /home/rocketmq/conf/broker.conf
    environment:
      TZ: Asia/Shanghai
      NAMESRV_ADDR: rocketmq-namesrv:9876
      BROKER_IP: ${BROKER_IP:-}
      JAVA_OPT_EXT: "-Xms192m -Xmx192m -Xmn96m"
    ports:
      - "${INFRA_BIND_IP:-127.0.0.1}:10909:10909"
      - "${INFRA_BIND_IP:-127.0.0.1}:10911:10911"
      - "${INFRA_BIND_IP:-127.0.0.1}:10912:10912"
    volumes:
      - ./deploy/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - rocketmq-broker-logs:/home/rocketmq/logs
      - rocketmq-broker-store:/home/rocketmq/store
    networks:
      - xiaohashu

  nacos:
    image: nacos/nacos-server:v2.2.1
    restart: unless-stopped
    mem_limit: 512m
    environment:
      TZ: Asia/Shanghai
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 192m
      JVM_XMX: 320m
      JVM_XMN: 96m
    ports:
      - "${INFRA_BIND_IP:-127.0.0.1}:8848:8848"
      - "${INFRA_BIND_IP:-127.0.0.1}:9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/v1/console/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - xiaohashu

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    mem_limit: 128m
    command: server /data --console-address ":9001"
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${INFRA_BIND_IP:-127.0.0.1}:9000:9000"
      - "${INFRA_BIND_IP:-127.0.0.1}:9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - xiaohashu

  minio-init:
    image: minio/mc:latest
    restart: "no"
    mem_limit: 96m
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          sleep 2
        done
        mc mb --ignore-existing local/xiaohashu
        mc anonymous set download local/xiaohashu
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    networks:
      - xiaohashu
